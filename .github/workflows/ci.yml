name: CI

# Checks the working tree with the same task a contributor runs locally:
# `blueprint run check`, which is scripts/all_tests.py. The package compiler
# is the latest Roc nightly; nothing pins it, and the check's compiler step
# reports which one ran. A new nightly can break an untouched pull request:
# compare with the latest scheduled run on main before treating a failure as
# the change's fault.
#
# The daily schedule runs the same check on main against that day's latest
# nightly, so main (and the next release candidate cut from it) is known to
# work with the current compiler. Published final releases are checked daily
# by nightly.yml instead.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 12 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # This job name is the required status check.
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@1f3bc71102cf2d07c324b6009a41823efd21c9aa

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler

      - run: blueprint check

      - name: Run every check
        # Fuzzing and benchmarks only smoke-test here; full runs are local.
        run: blueprint run check -- --smoke
