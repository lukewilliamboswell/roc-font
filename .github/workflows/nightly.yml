name: Nightly compatibility

# Does the release people download today still work with today's Roc
# nightly? The shared roc-automation workflow tests the examples archive
# attached to the latest final release, exactly as published, and keeps one
# tracking issue. It never commits, merges or publishes.
#
# Every release attaches roc-font-examples-<tag>.zip (built and tested by
# release.yml with scripts/examples.py): the examples, their recorded
# output in spec.json, and the release's bundle URL. Before the first final
# release there is nothing to test, and selection fails saying so. The job
# is the canonical single call, so the downstream dashboard can verify it.
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      nightly-tag:
        description: "Nightly to test, e.g. nightly-2026-10-23-18478ff; empty uses the latest"
        type: string
        default: ''
      release-tag:
        description: "Release to test, e.g. 0.1.0; empty uses the latest final release"
        type: string
        default: ''

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/nightly-compatibility.yml@1f3bc71102cf2d07c324b6009a41823efd21c9aa
    with:
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      release-tag: ${{ inputs.release-tag || '' }}
      runners: '["ubuntu-24.04"]'
