name: Documentation

# Renders the manual in docs/ as a site, static Markdown and a PDF with the
# released roc-docs renderer pinned in Blueprint.lock, adds the API
# reference generated by `roc docs`, and deploys the site to GitHub Pages
# from the default branch.
#
# The site deploys only when the repository variable PAGES_ENABLED is
# 'true' (set it once Pages uses GitHub Actions as its source); until then
# pull requests and pushes still build and check the manual.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the manual and site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the compiler pin
        id: pin
        run: |
          tag="$(tr -d '[:space:]' < .roc-version)"
          case "$tag" in
            nightly-*) echo "tag=$tag" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::.roc-version does not name a nightly: $tag"; exit 1 ;;
          esac

      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@1f3bc71102cf2d07c324b6009a41823efd21c9aa
        with:
          cache: 'true'
          cache-workload: docs

      # Only the API reference needs a compiler.
      - name: Install the pinned Roc nightly
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.pin.outputs.tag }}

      - id: renderer
        uses: lukewilliamboswell/roc-automation/actions/blueprint-tool@1f3bc71102cf2d07c324b6009a41823efd21c9aa
        with:
          task: docs-path
          label: roc-docs tools-0.2.0

      - id: docs
        uses: lukewilliamboswell/roc-automation/actions/build-docs@1f3bc71102cf2d07c324b6009a41823efd21c9aa
        with:
          renderer-binary: ${{ steps.renderer.outputs.binary }}
          pdf-filename: roc-font.pdf
          docs-version: main
          api-entrypoint: package/main.roc

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.docs.outputs.site-directory }}

  # Holds the Pages permissions, checks out nothing, and deploys the artifact
  # the build job produced.
  deploy:
    name: Deploy the site
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
